name: HayDocs
options:
  bundleIdPrefix: com.haydocs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HayDocs:
    type: application
    platform: iOS
    sources:
      - path: HayDocs
        excludes:
          - "**/*.h"
          - "Info.plist"
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        type: folder
      - path: Resources/Samples
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydocs.reader
        PRODUCT_NAME: HayDocs
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: HayDocs/Engine/HayDocs-Bridging-Header.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/engine/build/ios
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/engine/build/ios-sim
        OTHER_LDFLAGS: -lhaydocs_engine -framework Security -framework CoreFoundation -framework SystemConfiguration
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_KEY_CFBundleDisplayName: HayDocs
    info:
      path: HayDocs/Info.plist
      properties:
        CFBundleDisplayName: HayDocs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Камера нужна, чтобы сканировать документы.
        NSPhotoLibraryAddUsageDescription: Чтобы сохранить страницу как картинку в Фото.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Word
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.wordprocessingml.template
              - com.microsoft.word.doc
              - com.microsoft.word.dot
              - org.openxmlformats.wordprocessingml.document.macroenabled
          - CFBundleTypeName: OpenDocument
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.oasis-open.opendocument.text
              - org.oasis-open.opendocument.text-template
          - CFBundleTypeName: Text
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.rtf, public.plain-text, public.html, net.daringfireball.markdown]
          - CFBundleTypeName: Spreadsheet and slides
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.excel.xls
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Font
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.truetype-ttf-font, public.opentype-font, public.font]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.oasis-open.opendocument.text
            UTTypeDescription: OpenDocument Text
            UTTypeConformsTo: [public.data, public.content, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [odt]
              public.mime-type: [application/vnd.oasis.opendocument.text]
          - UTTypeIdentifier: org.oasis-open.opendocument.text-template
            UTTypeDescription: OpenDocument Text Template
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [ott]
              public.mime-type: [application/vnd.oasis.opendocument.text-template]
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
  HayDocsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HayDocsUITests
    dependencies:
      - target: HayDocs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydocs.reader.uitests
        TEST_TARGET_NAME: HayDocs
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HayDocs:
    build:
      targets:
        HayDocs: all
        HayDocsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HayDocsUITests
    archive:
      config: Release
